name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Performance budget (Lighthouse CI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm install (not npm ci) for the same lockfile-drift reason as ci.yml.
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run build
        working-directory: app
      # Audits the built dist/ (index.html + dashboard.html) against the
      # budgets in app/lighthouserc.json; fails on any assertion regression.
      # No live backend is needed: pages render their connect/empty states.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json
        working-directory: app
