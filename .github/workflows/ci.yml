name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Worker console + dashboard (build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm ci here (not npm install): the wallet-kit dependency tree pulls in
      # several native/optional modules (usb, secp256k1, utf-8-validate, etc.)
      # whose platform-conditional lockfile entries didn't stay in sync
      # between local generation and the Linux CI runner — npm ci enforces an
      # exact match and failed on it in practice; npm install tolerates it.
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: app

  e2e:
    name: E2E (Playwright quick-start wallet flow)
    runs-on: ubuntu-latest
    # Real testnet transactions (sponsor funding, paid question, settlement)
    # are inherently slower than unit tests; give the suite room to retry
    # through testnet congestion without masking real regressions.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Run Playwright E2E suite
        run: npx playwright test
        working-directory: app
        env:
          # Point the suite at a real (or realistically faked) testnet backend.
          # Override via repo/environment secrets when running against a live
          # testnet; the suite falls back to its local fake backend otherwise.
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TESTNET_RPC_URL: ${{ secrets.E2E_TESTNET_RPC_URL }}
          E2E_SPONSOR_URL: ${{ secrets.E2E_SPONSOR_URL }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  demo-agent:
    name: Demo scripts (syntax check + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-agent/package-lock.json
      - run: npm ci
        working-directory: demo-agent
      - run: npm run check
        working-directory: demo-agent
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: demo-agent
