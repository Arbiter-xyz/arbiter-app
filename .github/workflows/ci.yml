name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Worker console + dashboard (build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm ci here (not npm install): the wallet-kit dependency tree pulls in
      # several native/optional modules (usb, secp256k1, utf-8-validate, etc.)
      # whose platform-conditional lockfile entries didn't stay in sync
      # between local generation and the Linux CI runner — npm ci enforces an
      # exact match and failed on it in practice; npm install tolerates it.
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run build
        working-directory: app
      # Hard, enforced bundle-size budget (issue #4). The wallet-kit chunk
      # used to be a single 735KB monolith; per-adapter dynamic imports split
      # it so no single chunk may exceed the budget below. This check fails
      # the build if any emitted chunk regresses past the budget, keeping the
      # split honest instead of letting weight silently creep back in.
      - name: Enforce bundle-size budget
        run: node scripts/check-bundle-budget.mjs
        working-directory: app
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: app

  a11y:
    name: Accessibility (axe-core, WCAG 2.1 AA, LTR + RTL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: app
      # Serve the built app and the static landing page, then fail the build
      # on any new WCAG 2.1 A/AA violation (issue #5).
      - name: Run axe-core against every page
        working-directory: app
        run: |
          npx vite preview --port 4173 --strictPort &
          npx vite ../landing --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && curl -sf http://localhost:4174 >/dev/null && break; sleep 2; done
          npm run a11y -- http://localhost:4173 http://localhost:4174

  e2e:
    name: E2E (Playwright quick-start wallet flow)
    runs-on: ubuntu-latest
    # Real testnet transactions (sponsor funding, paid question, settlement)
    # are inherently slower than unit tests; give the suite room to retry
    # through testnet congestion without masking real regressions.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Run Playwright E2E suite
        run: npx playwright test
        working-directory: app
        env:
          # Point the suite at a real (or realistically faked) testnet backend.
          # Override via repo/environment secrets when running against a live
          # testnet; the suite falls back to its local fake backend otherwise.
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TESTNET_RPC_URL: ${{ secrets.E2E_TESTNET_RPC_URL }}
          E2E_SPONSOR_URL: ${{ secrets.E2E_SPONSOR_URL }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  demo-agent:
    name: Demo scripts (syntax check + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-agent/package-lock.json
      - run: npm ci
        working-directory: demo-agent
      - run: npm run check
        working-directory: demo-agent
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: demo-agent
