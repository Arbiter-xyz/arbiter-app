name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Worker console + dashboard (build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: app

  demo-agent:
    name: Demo scripts (syntax check + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-agent/package-lock.json
      - run: npm ci
        working-directory: demo-agent
      - run: npm run check
        working-directory: demo-agent
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: demo-agent
