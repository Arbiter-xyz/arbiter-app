name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Worker console + dashboard (build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm ci here (not npm install): the wallet-kit dependency tree pulls in
      # several native/optional modules (usb, secp256k1, utf-8-validate, etc.)
      # whose platform-conditional lockfile entries didn't stay in sync
      # between local generation and the Linux CI runner — npm ci enforces an
      # exact match and failed on it in practice; npm install tolerates it.
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: app

  demo-agent:
    name: Demo scripts (syntax check + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-agent/package-lock.json
      - run: npm ci
        working-directory: demo-agent
      - run: npm run check
        working-directory: demo-agent
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: demo-agent
