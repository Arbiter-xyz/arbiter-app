<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbiter — Customer Account</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Arbiter <span class="tag">customer account</span></h1>
        <p class="sub">
          For API-key / fiat (Stripe) customers — check your prepaid balance and top up.
          <a href="/index.html">Worker console →</a>
          <a href="/dashboard.html">Buyer dashboard →</a>
          <a href="/leaderboard.html">Leaderboard →</a>
          <a href="/admin.html">Admin →</a>
        </p>
      </header>

      <section id="panel-login" class="panel">
        <h2>Sign in</h2>
        <p class="muted small">Paste the API key you received at checkout to continue.</p>
        <div class="row">
          <input
            id="customer-key-input"
            type="password"
            placeholder="API key"
            style="flex: 1; padding: 0.5rem 0.7rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--fg)"
          />
          <button id="btn-customer-login">Enter</button>
        </div>
        <p id="customer-login-status" class="muted small"></p>
      </section>

      <section id="panel-account" class="panel hidden">
        <div class="row">
          <div>
            <div class="muted small">Account</div>
            <strong id="account-id"></strong>
          </div>
          <button id="btn-customer-logout" class="secondary" type="button">Sign out</button>
        </div>

        <div class="row" style="margin-top: 0.75rem">
          <div>
            <div class="muted small">Credit balance</div>
            <strong id="credit-balance">— USDC</strong>
            <div class="muted small" id="credit-balance-stroops"></div>
          </div>
          <button id="btn-top-up">Top up</button>
        </div>
        <p id="account-status" class="muted small"></p>
      </section>

      <section class="panel">
        <h2>Activity log</h2>
        <ul id="log"></ul>
      </section>
    </main>

    <script type="module" src="/src/customer.js"></script>
  </body>
</html>
